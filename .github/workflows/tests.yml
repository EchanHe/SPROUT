name: tests

on:
  pull_request:

jobs:
  macos-debug:
    name: macos debug / napari ${{ matrix.napari }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        napari: ["0.6.1", "0.7.1"]
    env:
      PYTHONFAULTHANDLER: "1"
      QT_QPA_PLATFORM: cocoa
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-ci.txt "napari[pyqt5]==${{ matrix.napari }}"
      - run: pip install -e ./napari_sprout
      - name: Versions
        run: |
          sw_vers
          uname -m
          pip list | grep -iE '^(napari|pyqt|vispy|numpy|pyopengl|qtpy) ' || true
      - name: A viewer alone
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: python -c "import napari; v = napari.Viewer(show=False); print('viewer ok'); v.close(); print('closed ok')"
      - name: A viewer with the GL shim
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          python - <<EOF
          import sys
          sys.path.insert(0, "$GITHUB_WORKSPACE/tests")
          import _headless_gl
          import napari
          v = napari.Viewer(show=False)
          print("viewer ok")
          v.close()
          print("closed ok")
          EOF
      - name: A check, with the crash stack
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tests/check_info_widget.py" 2>&1 | tail -70
      - name: A probe that worked on 0.7.1
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tests/probe_known_bugs.py" load_scheme_reads_good_files 2>&1 | tail -40
