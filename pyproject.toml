[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sprout-seg"
dynamic = ["version"]
description = "SPROUT: semi-automated parcellation of 2D and 3D greyscale images into parts, by thresholds, erosion and growing"
readme = { file = "docs/pypi_sprout_seg.md", content-type = "text/markdown" }   # the PyPI page (README.MD has relative links)
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yichen He" }]
keywords = ["segmentation", "image analysis", "micro-CT", "CT", "MRI", "3D", "multi-class", "seeds", "region growing"]
requires-python = ">=3.10"
# Lower bounds are the versions the CI tests (requirements-ci.txt); the "latest" CI job tests the newest.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.15",
    "scikit-image>=0.22",
    "pandas>=2.2",
    "tifffile>=2024.2.12",
    "imagecodecs>=2025.3.30",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "pillow>=10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
mesh = ["trimesh>=4.3", "matplotlib>=3.8"]
ai = ["nninteractive>=1.1.3", "scikit-learn"]
test = ["pytest"]

[project.scripts]
sprout = "sprout_core.cli:main"

[project.urls]
Homepage = "https://github.com/EchanHe/SPROUT"
Documentation = "https://github.com/EchanHe/SPROUT#readme"
Issues = "https://github.com/EchanHe/SPROUT/issues"
Changelog = "https://github.com/EchanHe/SPROUT/blob/main/CHANGELOG.md"

[tool.setuptools]
# template/ stays where the docs and the paper point; installed, it is sprout_core/templates (sprout --template)
packages = ["sprout_core", "sprout_core.templates"]
package-dir = { "sprout_core.templates" = "template" }

[tool.setuptools.package-data]
"sprout_core.templates" = ["*.yaml", "*.csv"]

[tool.setuptools.dynamic]
version = { attr = "sprout_core.__version__" }
