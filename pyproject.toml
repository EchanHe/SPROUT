[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sprout-seg"
dynamic = ["version"]
description = "SPROUT: semi-automated parcellation of 2D and 3D greyscale images into parts, by thresholds, erosion and growing"
readme = { file = "README.MD", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yichen He" }]
requires-python = ">=3.10"
# Lower bounds are the versions the CI tests (requirements-ci.txt); the "latest" CI job tests the newest.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.15",
    "scikit-image>=0.22",
    "pandas>=2.2",
    "tifffile>=2024.2.12",
    "imagecodecs>=2025.3.30",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "pillow>=10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
mesh = ["trimesh>=4.3", "matplotlib>=3.8"]
ai = ["nninteractive>=1.1.3", "scikit-learn"]
test = ["pytest"]

[project.scripts]
sprout = "sprout_core.cli:main"

[project.urls]
Homepage = "https://github.com/EchanHe/SPROUT"
Issues = "https://github.com/EchanHe/SPROUT/issues"

[tool.setuptools.packages.find]
include = ["sprout_core*"]

[tool.setuptools.dynamic]
version = { attr = "sprout_core.__version__" }
